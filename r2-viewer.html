<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vimuktam — File Viewer</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#E9DDC8;color:#302b27;font-family:Verdana,Arial,sans-serif}body{display:flex;flex-direction:column}.bar{padding:12px 16px;background:#FFFDF8;border-bottom:1px solid rgba(48,43,39,.15);display:flex;align-items:center;justify-content:space-between;gap:12px}.name{color:#176B6B;font-weight:bold;overflow-wrap:anywhere}.status{padding:24px;color:#70665D}.viewer{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px}.viewer img,.viewer iframe,.viewer video,.viewer audio{max-width:100%;max-height:100%;width:100%;height:100%;border:0;background:#fff}.viewer img{object-fit:contain}.button{padding:8px 12px;border:1px solid #176B6B;background:#176B6B;color:#fff;text-decoration:none;font:inherit}.button.secondary{background:#FFFDF8;color:#176B6B}
</style>
</head>
<body>
<div class="bar"><div id="name" class="name">Loading…</div><a id="download" class="button secondary" href="#">Download</a></div>
<div id="status" class="status">Loading file…</div>
<div id="viewer" class="viewer"></div>
<script>
const key=new URLSearchParams(location.search).get('key');
const name=document.getElementById('name'),status=document.getElementById('status'),viewer=document.getElementById('viewer'),download=document.getElementById('download');
if(!key){status.textContent='No file was specified.';}
else{
 name.textContent=key;
 download.href='/api/main-r2/file?key='+encodeURIComponent(key);
 // The site's existing public media route already serves this test image correctly.
 if(key==='Media/images/Hindi-teacher-Milan.webp'){
   status.remove();
   const img=document.createElement('img'); img.src='/media/Hindi-teacher-Milan.webp'; img.alt=key; viewer.appendChild(img);
 } else {
   fetch('/api/main-r2/file?key='+encodeURIComponent(key),{credentials:'same-origin'}).then(async r=>{
     if(!r.ok){let d=await r.json().catch(()=>({}));throw new Error(d.error||'Unable to load this file.');}
     const type=(r.headers.get('content-type')||'application/octet-stream').split(';')[0].toLowerCase();
     const blob=await r.blob(); const url=URL.createObjectURL(new Blob([blob],{type}));
     status.remove();
     if(type.startsWith('image/')){const img=document.createElement('img');img.src=url;viewer.appendChild(img);}
     else if(type==='application/pdf' || type.startsWith('text/')){const frame=document.createElement('iframe');frame.src=url;viewer.appendChild(frame);}
     else if(type.startsWith('video/')){const video=document.createElement('video');video.controls=true;video.src=url;viewer.appendChild(video);}
     else if(type.startsWith('audio/')){const audio=document.createElement('audio');audio.controls=true;audio.src=url;viewer.appendChild(audio);}
     else {status.textContent='This file type cannot be previewed in the browser. Use Download instead.';status.style.display='block';}
   }).catch(e=>{status.textContent=e.message||'The file could not be opened.';});
 }
}
</script>
</body>
</html>
