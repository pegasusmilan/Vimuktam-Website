name: One-time typography adjustment

on:
  push:
    paths:
      - '.github/workflows/typography-adjustment.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reduce Brand Identity headings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('brand-identity.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'font-size:clamp(4rem,9vw,8rem)': 'font-size:clamp(2.4rem,5.4vw,4.8rem)',
              'font-size:clamp(2.7rem,5vw,4.5rem)': 'font-size:clamp(1.62rem,3vw,2.7rem)',
              'font-size:2rem': 'font-size:1.2rem',
              'font-size:1.8rem': 'font-size:1.08rem',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "Vimuktam"
          git config user.email "pegasusmilan@gmail.com"
          git add brand-identity.html
          git rm .github/workflows/typography-adjustment.yml
          git commit -m "Reduce headings in brand identity document"
          git push
